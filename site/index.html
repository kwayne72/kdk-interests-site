<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KDK Interests — Under Construction</title>
  <meta name="description" content="KDK Interests LLC is being built. A Dallas-born house of companies." />
  <meta name="theme-color" content="#05070b" />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #05070b;
      --ivory: #f4eee4;
      --gold: #d4b56a;
      --gold-hot: #f3e0a8;
      --sage: #8aa58a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--ink);
      color: var(--ivory);
      font-family: Outfit, system-ui, sans-serif;
      overflow: hidden;
      min-height: 100dvh;
    }
    canvas#dust {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .aurora {
      position: fixed;
      inset: -20%;
      z-index: 0;
      background:
        radial-gradient(ellipse 50% 40% at 20% 20%, rgba(212,181,106,.18), transparent 55%),
        radial-gradient(ellipse 45% 50% at 82% 12%, rgba(138,165,138,.14), transparent 50%),
        radial-gradient(ellipse 60% 50% at 50% 110%, rgba(212,181,106,.12), transparent 55%),
        radial-gradient(circle at 50% 50%, #0a0e16 0%, #05070b 70%);
      animation: drift 18s ease-in-out infinite alternate;
      filter: saturate(1.15);
    }
    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) scale(1); }
      to   { transform: translate3d(2%, 2%, 0) scale(1.06); }
    }
    .veil {
      position: fixed;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(5,7,11,.15) 0%, rgba(5,7,11,.35) 100%),
        repeating-linear-gradient(0deg, transparent 0 3px, rgba(0,0,0,.06) 3px 4px);
      pointer-events: none;
    }
    .frame {
      position: fixed;
      inset: 18px;
      z-index: 2;
      border: 1px solid rgba(212,181,106,.28);
      pointer-events: none;
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: var(--gold);
      border-style: solid;
    }
    .frame::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
    .frame::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
    main {
      position: relative;
      z-index: 3;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 4.5rem 1.5rem 3rem;
      text-align: center;
    }
    .mark {
      width: 86px;
      height: 86px;
      margin: 0 auto 1.6rem;
      color: var(--gold-hot);
      filter: drop-shadow(0 0 18px rgba(212,181,106,.45));
      animation: pulse 4.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(212,181,106,.35)); }
      50% { transform: scale(1.06); filter: drop-shadow(0 0 28px rgba(243,224,168,.7)); }
    }
    .kicker {
      letter-spacing: .34em;
      text-transform: uppercase;
      font-size: .72rem;
      color: var(--gold);
      font-weight: 400;
    }
    h1 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 500;
      font-size: clamp(3rem, 9vw, 7.2rem);
      line-height: .92;
      margin: .55rem 0 .2rem;
      background: linear-gradient(110deg, #fff6e4 10%, #d4b56a 42%, #fff 50%, #d4b56a 58%, #f4eee4 90%);
      background-size: 220% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: shine 6s linear infinite;
    }
    @keyframes shine {
      to { background-position: 220% center; }
    }
    .italic {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-style: italic;
      font-weight: 400;
      font-size: clamp(1.35rem, 3.2vw, 2.05rem);
      color: #f4eee4d4;
      margin: .4rem 0 1.4rem;
    }
    .rule {
      width: 88px;
      height: 1px;
      margin: 0 auto 1.4rem;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .status {
      display: inline-flex;
      align-items: center;
      gap: .7rem;
      border: 1px solid rgba(212,181,106,.38);
      background: rgba(12,16,22,.45);
      backdrop-filter: blur(10px);
      padding: .55rem 1.05rem;
      border-radius: 999px;
      letter-spacing: .22em;
      text-transform: uppercase;
      font-size: .68rem;
      color: var(--gold-hot);
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--gold-hot);
      box-shadow: 0 0 10px var(--gold-hot);
      animation: blink 1.6s ease-in-out infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .35; transform: scale(.75); }
    }
    .lede {
      max-width: 34rem;
      margin: 1.35rem auto 0;
      color: #f4eee4b8;
      font-weight: 300;
      line-height: 1.65;
      font-size: 1.02rem;
    }
    .doors {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: .75rem;
      margin-top: 1.8rem;
    }
    .doors a {
      color: var(--ivory);
      text-decoration: none;
      border: 1px solid rgba(243,238,228,.22);
      padding: .7rem 1.15rem;
      font-size: .78rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      transition: border-color .25s, background .25s, color .25s, box-shadow .25s;
    }
    .doors a:hover {
      border-color: var(--gold);
      color: var(--gold-hot);
      background: rgba(212,181,106,.08);
      box-shadow: 0 0 24px rgba(212,181,106,.18);
    }
    footer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 1.35rem;
      z-index: 3;
      text-align: center;
      font-size: .68rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: #f4eee466;
    }
    @media (max-width: 640px) {
      .frame { inset: 10px; }
      footer { position: static; margin-top: 2.5rem; }
      body { overflow: auto; }
    }
  </style>
</head>
<body>
  <div class="aurora" aria-hidden="true"></div>
  <canvas id="dust" aria-hidden="true"></canvas>
  <div class="veil" aria-hidden="true"></div>
  <div class="frame" aria-hidden="true"></div>

  <main>
    <div>
      <svg class="mark" viewBox="0 0 36 36" fill="none" aria-hidden="true">
        <path d="M5 16.5 18 6.5 31 16.5" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M9 16.5v12M18 16.5v12M27 16.5v12" stroke="currentColor" stroke-width="1.4"/>
        <path d="M9 28.5h18" stroke="currentColor" stroke-width="1.4"/>
      </svg>
      <p class="kicker">KDK Interests LLC</p>
      <h1>Under<br>Construction</h1>
      <p class="italic">The house is being built.</p>
      <div class="rule"></div>
      <p class="status"><span class="dot"></span> Raising the rooms</p>
      <p class="lede">A Dallas-born house of companies. KDK TX and KDK Media already have their doors. This roof — the parent — is getting its finish.</p>
      <div class="doors">
        <a href="https://kdktx.com" target="_blank" rel="noreferrer">KDK TX</a>
        <a href="https://kennyanddon.com" target="_blank" rel="noreferrer">KDK Media</a>
      </div>
    </div>
  </main>
  <footer>Dallas · © 2026 KDK Interests LLC</footer>

  <script>
    const c = document.getElementById("dust");
    const ctx = c.getContext("2d");
    let w, h, parts;
    function resize() {
      w = c.width = innerWidth;
      h = c.height = innerHeight;
      const n = Math.min(140, Math.floor((w * h) / 14000));
      parts = Array.from({ length: n }, () => ({
        x: Math.random() * w,
        y: Math.random() * h,
        r: Math.random() * 1.7 + .3,
        s: Math.random() * .35 + .08,
        a: Math.random() * .55 + .12,
        tw: Math.random() * Math.PI * 2
      }));
    }
    function tick(t) {
      ctx.clearRect(0, 0, w, h);
      for (const p of parts) {
        p.y -= p.s;
        p.x += Math.sin((t * 0.0004) + p.tw) * 0.18;
        if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; }
        const glow = 0.45 + Math.sin(t * 0.003 + p.tw) * 0.35;
        ctx.beginPath();
        ctx.fillStyle = `rgba(243,224,168,${p.a * glow})`;
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    addEventListener("resize", resize);
    resize();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
