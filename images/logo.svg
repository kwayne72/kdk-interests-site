<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 90" width="280" height="90" role="img" aria-label="KDK Interests">
  <defs>
    <linearGradient id="kGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a7a6d"/>
      <stop offset="100%" stop-color="#0f2c4c"/>
    </linearGradient>
  </defs>
  <!-- Left K - partner side (Don) -->
  <path d="M22 16 L22 74 M22 45 L52 16 M22 45 L52 74" fill="none" stroke="#0f2c4c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Playful dual accent (two sides) -->
  <circle cx="64" cy="30" r="6" fill="#1a7a6d"/>
  <circle cx="64" cy="60" r="6" fill="#1a7a6d"/>
  <!-- Central D as modern abstract doorway / home -->
  <path d="M80 16 L80 74 Q115 74 115 45 Q115 16 80 16 Z" fill="#0f2c4c"/>
  <rect x="93" y="36" width="12" height="24" rx="2" fill="#1a7a6d"/>
  <!-- Right K - partner side, interlocking feel -->
  <path d="M150 16 L150 74 M150 45 L120 16 M150 45 L120 74" fill="none" stroke="#0f2c4c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Second dual accents -->
  <circle cx="168" cy="30" r="6" fill="#1a7a6d"/>
  <circle cx="168" cy="60" r="6" fill="#1a7a6d"/>
  <!-- Wordmark -->
  <text x="190" y="48" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#0f2c4c" letter-spacing="1">KDK</text>
  <text x="190" y="68" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#1a7a6d" letter-spacing="2.5">INTERESTS</text>
</svg>
