<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 90" width="320" height="90" role="img" aria-label="KDK Interests">
  <defs>
    <!-- Teal → Navy gradient matching the concept logos -->
    <linearGradient id="tealNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a7a6d"/>
      <stop offset="55%" stop-color="#0f4a5c"/>
      <stop offset="100%" stop-color="#0f2c4c"/>
    </linearGradient>
    <linearGradient id="navySolid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2c4c"/>
      <stop offset="100%" stop-color="#0a1f36"/>
    </linearGradient>
  </defs>

  <!-- ===== Left interlocking K (gradient) ===== -->
  <!-- Vertical stem -->
  <rect x="18" y="14" width="18" height="62" rx="3" fill="url(#tealNavy)"/>
  <!-- Upper arm -->
  <path d="M36 14 L72 14 L58 36 L36 36 Z" fill="url(#tealNavy)"/>
  <!-- Lower arm -->
  <path d="M36 54 L58 54 L72 76 L36 76 Z" fill="url(#tealNavy)"/>

  <!-- ===== Central interlocking form (navy) – creates the dual-partner lock ===== -->
  <path d="M68 14 
           L92 14 
           L92 32 
           L78 46 
           L92 60 
           L92 76 
           L68 76 
           L68 58 
           L82 46 
           L68 34 
           Z" fill="url(#navySolid)"/>

  <!-- ===== Right K (navy) ===== -->
  <rect x="98" y="14" width="18" height="62" rx="3" fill="url(#navySolid)"/>
  <!-- Upper arm -->
  <path d="M116 14 L152 14 L138 36 L116 36 Z" fill="url(#navySolid)"/>
  <!-- Lower arm -->
  <path d="M116 54 L138 54 L152 76 L116 76 Z" fill="url(#navySolid)"/>

  <!-- ===== Wordmark ===== -->
  <text x="172" y="42" 
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="28" font-weight="700" fill="#0f2c4c" letter-spacing="1.5">KDK</text>
  <text x="172" y="64" 
        font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" 
        font-size="12" font-weight="600" fill="#1a7a6d" letter-spacing="3.2">INTERESTS</text>
</svg>